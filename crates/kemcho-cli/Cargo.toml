[package]
name = "kemcho-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
kemcho-core = { version = "0.1.0", path = "../kemcho-core" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
whisper-rs = { version = "0.16", features = ["tracing_backend"] }

[[bin]]
name = "kemcho"
path = "src/main.rs"
